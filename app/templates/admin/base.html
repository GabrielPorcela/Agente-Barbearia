<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Painel Administrativo - Barbearia{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 600; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('admin.visualizar_agenda') }}">💈 Barbearia — Admin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin.visualizar_agenda' %}active{% endif %}"
                       href="{{ url_for('admin.visualizar_agenda') }}">Agenda</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin.gerenciar_servicos' %}active{% endif %}"
                       href="{{ url_for('admin.gerenciar_servicos') }}">Serviços</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin.visualizar_clientes' %}active{% endif %}"
                       href="{{ url_for('admin.visualizar_clientes') }}">Clientes</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
